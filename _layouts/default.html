<!doctype html>
<html lang="{{ site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% unless page.noindex %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endunless %}
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <div class="wrap nav-bar">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Tom Lee home">Tom Lee</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Writing</a></li>
          <li><a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>Tags</a></li>
          <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.author.name | escape }}</span>
      <nav aria-label="Elsewhere">
        <ul>
          <li><a href="{{ site.github_profile }}">GitHub <span aria-hidden="true">↗</span></a></li>
          <li><a href="{{ site.medium_profile }}">Medium <span aria-hidden="true">↗</span></a></li>
          <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        </ul>
      </nav>
    </div>
  </footer>
</body>
</html>
