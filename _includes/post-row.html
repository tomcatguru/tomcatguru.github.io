<li class="post-row">
  <div>
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
    {% if include.post.description %}<p>{{ include.post.description | escape }}</p>{% endif %}
  </div>
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
</li>
